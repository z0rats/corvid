version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # react and react-dom must be bumped together - a solo bump leaves them on
      # mismatched versions, which react-dom refuses to run with.
      react:
        patterns:
          - "react"
          - "react-dom"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      # init and analyze must stay on the same codeql-action release - a solo bump
      # leaves them mismatched, which fails the analyze step at runtime.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
