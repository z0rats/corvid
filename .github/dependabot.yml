version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *"
    cooldown:
      default-days: 14
    groups:
      # keep majors as individual PRs (higher breakage risk, worth reviewing
      # one at a time); bundle everything else into one PR per run.
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *"
    cooldown:
      default-days: 14
    groups:
      # react and react-dom must be bumped together - a solo bump leaves them on
      # mismatched versions, which react-dom refuses to run with.
      react:
        patterns:
          - "react"
          - "react-dom"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *"
    cooldown:
      default-days: 14

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *"
    cooldown:
      default-days: 14

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *"
    cooldown:
      default-days: 14
    groups:
      # init and analyze must stay on the same codeql-action release - a solo bump
      # leaves them mismatched, which fails the analyze step at runtime.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
