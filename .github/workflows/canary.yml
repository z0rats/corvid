name: Source canaries

# Weekly live check of external sources (backend/tests/canary/: ru_business_check's registries,
# the keyless scraped/undocumented ones - Reddit archives, threat-actor usernames, Hudson Rock,
# YouTube, DuckDuckGo, the OpenSanctions dump - the keyless ioc_lookup providers, the address-
# blacklist feeds and the default newsfeed RSS feeds): not "does our code work" but "did a
# source change its response shape, move, or start demanding a key". A failure means a fix.
# Sources unreachable from a GitHub runner (non-RU IP, rate limits, anti-bot) are skipped, not
# failed - see the outcome policy in each canary module's docstring.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install system build dependencies (lxml compiles from source on cp314)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libxml2-dev libxslt-dev liblzma-dev zlib1g-dev

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements*.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Run source canaries
        run: pytest -m canary -o addopts= -q -rs
