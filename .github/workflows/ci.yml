name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # need history to diff against the base/before commit, not just HEAD

      - name: Determine which components changed
        id: filter
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "::warning::Could not resolve a base commit to diff against - running backend and frontend unconditionally."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          echo "$changed"

          backend=false
          frontend=false
          grep -q '^backend/' <<< "$changed" && backend=true
          grep -q '^frontend/' <<< "$changed" && frontend=true

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install system build dependencies (lxml compiles from source on cp314)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libxml2-dev libxslt-dev liblzma-dev zlib1g-dev

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Check docs/database-schema.md is in sync with the models
        run: |
          python scripts/generate_db_docs.py
          if [ -n "$(git status --porcelain -- ../docs/database-schema.md)" ]; then
            echo "::error::docs/database-schema.md is stale or not committed - run 'python backend/scripts/generate_db_docs.py' from the repo root and commit the result."
            git diff -- ../docs/database-schema.md
            exit 1
          fi

      - name: Lint and type-check (ruff, mypy)
        # Report-only for now: the existing codebase predates this tooling and
        # carries a real backlog of findings (~1780 ruff, ~180 mypy as of
        # introduction) - fail every build on pre-existing issues until that
        # backlog is triaged down, then flip to blocking.
        continue-on-error: true
        run: |
          ruff check .
          ruff format --check .
          mypy app

      - name: Run tests
        run: pytest -v --cov=app --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Audit dependencies for known CVEs (pip-audit)
        # Report-only for now: this dependency tree includes several OSINT
        # tools (maigret, social-analyzer, mailcat-osint, pyppeteer...) not
        # under this repo's control, likely to already carry unfixable
        # transitive findings - don't fail every build on those until triaged.
        continue-on-error: true
        run: |
          uv pip install --system pip-audit
          pip-audit --desc

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check extension/generated-ioc-patterns.js is in sync with iocTypeDetection.ts
        run: |
          node scripts/generate-extension-ioc-patterns.js
          if [ -n "$(git status --porcelain -- ../extension/generated-ioc-patterns.js)" ]; then
            echo "::error::extension/generated-ioc-patterns.js is stale or not committed - run 'node frontend/scripts/generate-extension-ioc-patterns.js' from the repo root and commit the result."
            git diff -- ../extension/generated-ioc-patterns.js
            exit 1
          fi

      # Disabled while localization is paused for new features (English-only
      # additions expected to fail this check until translation work resumes).
      # - name: Check i18n locale keys are in sync
      #   run: yarn check:i18n

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

      - name: Audit dependencies for known CVEs (yarn npm audit)
        continue-on-error: true
        run: yarn npm audit --severity moderate --all

  docs-coverage:
    # Not path-scoped like backend/frontend above: this check spans frontend's feature
    # registry and website's docs pages, so it must run even on a website-only change.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Check every feature has a docs page
        run: node .github/scripts/check-docs-coverage.mjs

  docker-build:
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    # backend/frontend are skipped (not failed) when their path didn't change, and a
    # skipped dependency still satisfies `needs` - so without this, this job would build
    # and scan both images unconditionally on every push/PR, e.g. a website/docs-only change.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built with buildx + GHA cache (same mechanism as .github/workflows/publish-image.yml)
      # instead of a plain `docker compose build`, so an unchanged Dockerfile/deps layer -
      # including the Go-compiled subfinder/httpx/amass stage and lxml's from-source build -
      # is reused instead of rebuilt from scratch on every run. `type=docker` loads the result
      # into the local engine under the same tag `docker compose build` would have produced,
      # so the Trivy/smoke-test/teardown steps below (and `compose up` without `--build`) are
      # unchanged.
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          tags: corvid-backend:latest
          outputs: type=docker
          cache-from: type=gha,scope=ci-backend
          cache-to: type=gha,mode=max,scope=ci-backend

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          tags: corvid-frontend:latest
          outputs: type=docker
          cache-from: type=gha,scope=ci-frontend
          cache-to: type=gha,mode=max,scope=ci-frontend

      - name: Scan backend image for known CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true # report-only until the existing findings are triaged
        with:
          image-ref: corvid-backend:latest
          severity: HIGH,CRITICAL
          format: table

      - name: Scan frontend image for known CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: corvid-frontend:latest
          severity: HIGH,CRITICAL
          format: table

      - name: Smoke test backend
        run: |
          docker compose -f docker-compose.yaml up -d backend
          for i in $(seq 1 15); do
            if docker compose -f docker-compose.yaml exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthcheck')" 2>/dev/null; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          docker compose -f docker-compose.yaml logs backend
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yaml down

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks needs full history, not just the latest commit

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
