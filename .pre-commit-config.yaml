repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        files: ^backend/
        args: [--fix]
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: db-schema-docs
        name: Regenerate docs/database-schema.md
        description: Mirrors CI's staleness check - regenerates the file from the current models; if that changes it, `git add` it and commit again.
        entry: bash -c 'cd backend && uv run python scripts/generate_db_docs.py'
        language: system
        pass_filenames: false
        files: ^backend/app/.*/models/.*\.py$
      - id: ioc-provider-docs-check
        name: New ioc_lookup providers must touch website docs
        description: If service_registry.py gains a new provider, website's ioc-tools.md must be staged in the same commit.
        entry: python3 scripts/check_new_ioc_provider_docs.py
        language: system
        pass_filenames: false
        files: ^backend/app/features/ioc_tools/ioc_lookup/single_lookup/service/service_registry\.py$
