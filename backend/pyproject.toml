[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter-marker functions are meant to be called in a default
# value - B008 doesn't know that and flags every route handler using them.
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
]

[tool.coverage.run]
# `source` (as opposed to relying on pytest-cov's bare `--cov=app` flag) makes
# coverage.py walk the whole package and report never-imported files as 0%
# instead of silently omitting them from the report - without this, modules
# nothing imports (e.g. only wired through app/utils/router_registry.py,
# which no test exercises) don't count against the coverage percentage at all.
source = ["app"]

[tool.coverage.report]
# Most of app/ is implicit namespace packages (no __init__.py in most
# subdirs) - coverage.py's unexecuted-file walk skips those by default, which
# silently dropped ~90 real files (most of email_analyzer's routers/service,
# most of newsfeed, all of ioc_defanger, ...) out of the report entirely.
include_namespace_packages = true

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."
