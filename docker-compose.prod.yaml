name: corvid-prod

# Used by the one-line installer (install.sh) and manual GHCR-based deploys.
# Pulls pre-built images instead of building from source - see
# docker-compose.yaml for the build-from-source version used by contributors.
#
# Named as a separate Compose project (corvid-prod vs corvid) and without
# container_name overrides, so this can run alongside a local docker-compose.yaml
# dev stack on the same host without container/network name clashes. If both
# run at once, set FRONTEND_PORT for one of them to avoid a port clash on 4000.
services:
  backend:
    networks:
      - corvid-network
    image: ghcr.io/z0rats/corvid-backend:${CORVID_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/backend/data
    # Hard memory cap for the backend container (e.g. 2g) - 0 means no limit. If heavy scans
    # exceed it, Docker kills and restarts only this container instead of the host running out.
    mem_limit: ${BACKEND_MEM_LIMIT:-0}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthcheck', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Probed every start_interval (not interval) during start_period, so `up --wait` and the
      # frontend's depends_on see "healthy" seconds after boot instead of after the first 30s
      # interval. Generous start_period since first boot also runs migrations; it only bounds
      # how long failures are ignored, not how long a healthy start takes.
      start_period: 60s
      start_interval: 1s

  frontend:
    networks:
        - corvid-network
    image: ghcr.io/z0rats/corvid-frontend:${CORVID_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4000}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s

networks:
  corvid-network:
    driver: bridge
