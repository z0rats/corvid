name: corvid

services:
  backend:
    networks:
      - corvid-network
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/backend/data
    # Hard memory cap for the backend container (e.g. 2g) - 0 means no limit. If heavy scans
    # exceed it, Docker kills and restarts only this container instead of the host running out.
    mem_limit: ${BACKEND_MEM_LIMIT:-0}
    extra_hosts:
      # Docker Desktop (macOS/Windows) already resolves this automatically - this
      # entry is what makes it resolve on Linux too, so LLM_OLLAMA_BASE_URL=http://
      # host.docker.internal:11434/v1 works cross-platform for a host-run Ollama.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthcheck', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Probed every start_interval (not interval) during start_period, so `up --wait` and the
      # frontend's depends_on see "healthy" seconds after boot instead of after the first 30s
      # interval. Generous start_period since first boot also runs migrations; it only bounds
      # how long failures are ignored, not how long a healthy start takes.
      start_period: 60s
      start_interval: 1s

  frontend:
    networks:
        - corvid-network
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4000}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s

networks:
  corvid-network:
    driver: bridge