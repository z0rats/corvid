name: corvid

services:
  backend:
    networks:
      - corvid-network
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/backend/data
    extra_hosts:
      # Docker Desktop (macOS/Windows) already resolves this automatically - this
      # entry is what makes it resolve on Linux too, so LLM_OLLAMA_BASE_URL=http://
      # host.docker.internal:11434/v1 works cross-platform for a host-run Ollama.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthcheck', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    networks:
        - corvid-network
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4000}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  corvid-network:
    driver: bridge